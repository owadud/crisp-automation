# Push a tag like v3.1 -> builds the zip + sha256 and publishes a GitHub Release.
# The in-app "Check for updates" reads that release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and checksum
        run: python3 tools/make_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
